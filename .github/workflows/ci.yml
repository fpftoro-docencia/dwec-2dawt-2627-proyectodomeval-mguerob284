name: Integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Comprobar reglas de estilo y código con ESLint
        run: npm run lint

      - name: Comprobar formato del código con Prettier
        run: npm run format:check

  tests:
    name: Tests
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Ejecutar pruebas y medir cobertura con Vitest
        run: npm run coverage

      - name: Subir informe de cobertura como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: informe-cobertura
          path: coverage/

  e2e:
    name: E2E
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Instalar navegador Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de extremo a extremo con Playwright
        run: npm run e2e

      - name: Subir informe de Playwright en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright-fallo
          path: playwright-report/
