<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeMemories · Ficha de Partida</title>
    <link rel="icon" type="image/png" href="img/logo.png" />
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header id="cabecera-principal"></header>

    <main class="container py-4">
      <div id="zona-avisos" role="status" aria-live="polite" class="mb-3"></div>

      <div class="mb-4">
        <h1 class="h3 fw-bold mb-1" id="titulo-ficha">📝 Registrar Recuerdo de Partida</h1>
        <p class="text-muted small mb-0">
          Inmortaliza tu aventura, estadísticas y tu equipo campeón
        </p>
      </div>

      <!-- Contenedor del formulario de la entidad para el Sprint 2 -->
      <section class="card shadow-sm border-0 p-4">
        <div class="text-center py-5 text-muted">
          <p class="fs-5 mb-1">⚙️ El formulario del CRUD se implementará en el Sprint 2</p>
          <a href="listado.html" class="btn btn-outline-secondary btn-sm mt-2">
            Volver a la vitrina
          </a>
        </div>
      </section>
    </main>

    <footer class="py-3 text-center text-muted small mt-auto border-top">
      PokeMemories · Proyecto DWEC DOM
    </footer>

    <script type="module">
      import { protegerPagina, renderizarCabecera } from './js/componentes/cabecera.js';
      import { inicializarAvisos } from './js/avisos.js';

      inicializarAvisos();
      const sesion = protegerPagina();
      if (sesion) {
        renderizarCabecera(document.getElementById('cabecera-principal'), sesion, 'ficha.html');
      }
    </script>
  </body>
</html>
