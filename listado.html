<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeMemories · Salón de la Fama</title>
    <link rel="icon" type="image/png" href="img/logo.png" />
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header id="cabecera-principal"></header>

    <main class="container py-4">
      <div id="zona-avisos" role="status" aria-live="polite" class="mb-3"></div>

      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h1 class="h3 fw-bold mb-1">🏆 Vitrina de Recuerdos</h1>
          <p class="text-muted small mb-0">
            Partidas, victorias y hazañas de tus aventuras Pokémon
          </p>
        </div>
        <a href="ficha.html" class="btn btn-primary fw-bold" id="btn-nueva-partida">
          ➕ Inmortalizar Partida
        </a>
      </div>

      <section aria-label="Búsqueda de recuerdos" class="card shadow-sm border-0 p-3 mb-4">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-8">
            <label for="buscador-partidas" class="visually-hidden">Buscar recuerdos</label>
            <input
              type="search"
              id="buscador-partidas"
              class="form-control"
              placeholder="Buscar por título, código, edición o Pokémon"
              autocomplete="off"
            />
          </div>
          <div class="col-12 col-md-4 text-md-end">
            <p id="contador-resultados" class="text-muted small mb-0" aria-live="polite"></p>
          </div>
        </div>
      </section>

      <section id="seccion-listado" aria-label="Listado de partidas registradas">
        <div id="lista-partidas" class="row g-3"></div>

        <div id="estado-vacio" class="card shadow-sm border-0 p-5 text-center text-muted" hidden>
          <p id="estado-vacio-titulo" class="fs-5 mb-1"></p>
          <p id="estado-vacio-subtitulo" class="small mb-0"></p>
        </div>

        <div id="paginacion-partidas" class="mt-4"></div>
      </section>
    </main>

    <template id="plantilla-partida">
      <div class="col-12 col-md-6 col-lg-4">
        <article class="card h-100 shadow-sm border-0 tarjeta-partida">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
              <span class="badge bg-dark" data-campo="codigoRegistro"></span>
              <span class="badge bg-primary" data-campo="edicion"></span>
            </div>

            <h2 class="h5 card-title fw-bold mb-2" data-campo="titulo"></h2>

            <dl class="row small text-muted mb-3">
              <dt class="col-5">Victoria</dt>
              <dd class="col-7 mb-1" data-campo="fechaVictoria"></dd>
              <dt class="col-5">Tiempo</dt>
              <dd class="col-7 mb-1" data-campo="tiempoJuego"></dd>
              <dt class="col-5">Licencia</dt>
              <dd class="col-7 mb-0" data-campo="licenciaEntrenador"></dd>
            </dl>

            <div class="mb-3">
              <p class="small fw-semibold mb-1">⚔️ Equipo campeón</p>
              <ul class="list-unstyled d-flex flex-wrap gap-1 mb-0" data-campo="equipo"></ul>
            </div>

            <div class="bloque-leyenda-caida rounded p-2 small mb-3" data-bloque="leyendas" hidden>
              <p class="fw-semibold mb-1">🕯️ Leyendas Caídas · En nuestros corazones</p>
              <ul
                class="list-unstyled mb-0 d-flex flex-column gap-1"
                data-campo="leyendasCaidas"
              ></ul>
            </div>

            <div class="mt-auto pt-2 border-top d-flex justify-content-end gap-2">
              <a class="btn btn-outline-primary btn-sm" data-accion="editar">✏️ Editar</a>
              <button type="button" class="btn btn-outline-danger btn-sm" data-accion="borrar">
                🗑️ Borrar
              </button>
            </div>
          </div>
        </article>
      </div>
    </template>

    <dialog
      id="dialogo-borrar"
      class="dialogo-confirmacion rounded border-0 shadow-lg p-0"
      aria-labelledby="dialogo-borrar-titulo"
    >
      <div class="p-4">
        <h2 id="dialogo-borrar-titulo" class="h5 fw-bold mb-2">Confirmar borrado</h2>
        <p class="mb-4">
          ¿Seguro que quieres borrar el recuerdo <strong id="dialogo-borrar-nombre"></strong>? Esta
          acción no se puede deshacer
        </p>
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary" id="btn-cancelar-borrado">
            Cancelar
          </button>
          <button type="button" class="btn btn-danger" id="btn-confirmar-borrado">
            Sí, borrar recuerdo
          </button>
        </div>
      </div>
    </dialog>

    <footer class="py-3 text-center text-muted small mt-auto border-top">
      PokeMemories · Proyecto DWEC DOM
    </footer>

    <script type="module">
      import { iniciarListado } from './js/paginas/listado.js';
      iniciarListado();
    </script>
  </body>
</html>
