<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeMemories · Administración de Entrenadores</title>
    <link rel="icon" type="image/png" href="img/logo.png" />
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header id="cabecera-principal"></header>

    <main class="container py-4">
      <div id="zona-avisos" role="status" aria-live="polite" class="mb-3"></div>

      <div class="mb-4 encabezado-pagina">
        <h1 class="h3 fw-bold mb-1">👥 Administración de Entrenadores</h1>
        <p class="small mb-0">
          Gestión de cuentas y asignación de permisos de Profesor / Administrador
        </p>
      </div>

      <section aria-label="Búsqueda de usuarios" class="card shadow-sm border-0 p-3 mb-4">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-8">
            <label for="buscador-usuarios" class="visually-hidden">Buscar entrenadores</label>
            <input
              type="search"
              id="buscador-usuarios"
              class="form-control"
              placeholder="Buscar por nombre, correo o rol"
              autocomplete="off"
            />
          </div>
          <div class="col-12 col-md-4 text-md-end">
            <p id="contador-usuarios" class="text-muted small mb-0" aria-live="polite"></p>
          </div>
        </div>
      </section>

      <section id="seccion-usuarios" class="card shadow-sm border-0 p-3">
        <div class="table-responsive" id="tabla-usuarios-contenedor">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">Entrenador</th>
                <th scope="col">Correo electrónico</th>
                <th scope="col">Rol</th>
                <th scope="col" class="text-end">Permisos</th>
              </tr>
            </thead>
            <tbody id="lista-usuarios"></tbody>
          </table>
        </div>

        <div id="estado-vacio-usuarios" class="text-center py-5 text-muted" hidden>
          <p class="fs-5 mb-1">🔍 No hay entrenadores que coincidan con tu búsqueda</p>
          <p class="small mb-0">Prueba con otro nombre de entrenador, correo o rol</p>
        </div>

        <div id="paginacion-usuarios" class="mt-4"></div>
      </section>
    </main>

    <template id="plantilla-usuario">
      <tr data-fila-usuario>
        <td>
          <span class="fw-semibold" data-campo="nombreUsuario"></span>
          <span class="badge bg-info text-dark ms-1" data-campo="etiquetaTu" hidden>Tú</span>
        </td>
        <td data-campo="email"></td>
        <td>
          <span class="badge" data-campo="rol"></span>
        </td>
        <td class="text-end">
          <div class="d-inline-flex flex-column align-items-end gap-1">
            <button type="button" class="btn btn-sm" data-accion="cambiar-rol"></button>
            <small class="text-muted" data-campo="avisoPropio" hidden></small>
          </div>
        </td>
      </tr>
    </template>

    <footer class="py-3 text-center text-muted small mt-auto border-top">
      PokeMemories · Proyecto DWEC DOM
    </footer>

    <script type="module">
      import { iniciarUsuarios } from './js/paginas/usuarios.js';
      iniciarUsuarios();
    </script>
  </body>
</html>
