<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéMemories · Administración de Entrenadores</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header id="cabecera-principal"></header>

    <main class="container py-4">
      <div id="zona-avisos" role="status" aria-live="polite" class="mb-3"></div>

      <div class="mb-4">
        <h1 class="h3 fw-bold mb-1">👥 Administración de Entrenadores</h1>
        <p class="text-muted small mb-0">Gestión de cuentas y asignación de permisos de Profesor / Administrador</p>
      </div>

      <!-- Contenedor de la tabla de usuarios para el Sprint 2 -->
      <section id="seccion-usuarios" class="card shadow-sm border-0 p-4">
        <div class="text-center py-5 text-muted">
          <p class="fs-5 mb-1">🛡️ Zona exclusiva de Administradores</p>
          <p class="small">El listado completo de entrenadores y asignación de roles se completará en el Sprint 2</p>
        </div>
      </section>
    </main>

    <footer class="py-3 text-center text-muted small mt-auto border-top">
      PokéMemories · Proyecto DWEC DOM
    </footer>

    <script type="module">
      import { protegerPagina, renderizarCabecera } from './js/componentes/cabecera.js';
      import { inicializarAvisos } from './js/avisos.js';

      inicializarAvisos();
      // Protección: solo administradores pueden ver esta página (Requisito 7)
      const sesion = protegerPagina({ soloAdmin: true });
      if (sesion) {
        renderizarCabecera(document.getElementById('cabecera-principal'), sesion, 'usuarios.html');
      }
    </script>
  </body>
</html>
